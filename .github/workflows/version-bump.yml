name: Open version bump PR

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'automated-release') &&
      !contains(github.event.pull_request.labels.*.name, 'semver:skip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine bump type from PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo ",$LABELS," | grep -q ',semver:major,'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo ",$LABELS," | grep -q ',semver:minor,'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version --allow-same-version > /dev/null
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        run: node scripts/release/bump-changelog.mjs "${{ steps.version.outputs.old }}" "${{ steps.version.outputs.new }}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          OLD_VERSION: ${{ steps.version.outputs.old }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${NEW_VERSION}" \
            --label "automated-release" \
            --body "Automated ${BUMP_TYPE} version bump from v${OLD_VERSION} to v${NEW_VERSION}, triggered by #${SOURCE_PR}. Merging this tags the release and publishes a GitHub Release."
